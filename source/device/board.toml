# Root input remains independent of 17; no Data/log persistence or remote reset.
#031 USB/early-kernel diagnostics are retained for the first read-only root test.
kernel_args = ["-v", "keepsyms=1", "debug=0x14e", "cpus=8", "boot-progress=2", "nezha-log=0", "native-source-storage=1", "native-source-storage-require-usb=1", "native-ufs-root=1", "sheng-data-persist=2", "ram-data-volatile-4g=0", "sheng-data-reset=0", "sheng-log=0", "nezha-reboot-after=0", "nezha-panic-reset=0", "qcom-usb-debug=1", "qcom-usb-ctl=1", "nezha-usb-reboot=1", "use_contiguous_hint=0", "sheng-pmgr=2", "sheng-disable-watchdogd=1", "sheng-exc-name=SpringBoard,iconservicesagent", "offline-mobile-graphics-load=1", "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-unit-scale=3", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "offline-legacy-phase=4", "offline-key-events=1", "sheng-aks=1", "sheng-fb-gpu=1", "sheng-dpu-scanout=0", "offline-hid-input=1", "offline-hid-home=1", "sheng-touch-hid=1", "nezha-input=1", "nezha-touch=15", "boot-ui-follow=1", "offline-hid-auto-home=90", "boot-diag-console=2", "nezha-backlight=1", "input-test=0", "nezha-gpu-metal=1", "sheng-gpu-trace=1", "ndt=1", "sheng-gpu-addon=1", "boot-diag-overlay=0", "boot-ui-focus3=Preferences"]

# Format2 exports chosen metadata from the typed ADT table.
[adt.chosen.u32]
"kernel-ctrr-to-be-enabled" = 0
"nezha-baseband" = 1
"nezha-gnss" = 1

[adt.chosen.bytes]
"nezha-baseband-low-memory" = "00000000000000000000500000000000"

# First root mount: use the real independently verified iPhone OS identity.
[root]
os_volume_uuid = "28E4CF35-9C12-417E-B8FF-906618C6FD22"
systemos_volume_uuid = "FFADDA0D-7102-4121-8AB8-48818B912D06"
os_image_sha256 = "d7037ea730b12d11f72e751884c23b1f3c67bb12ccb828c750f9df5765ad093c"
systemos_image_sha256 = "00fac48583c9d347aa9403c9cecf8d511650fba28f670aa70265e4c61f46aad8"
[payload.adt]
