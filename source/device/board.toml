# iPhone iOS27 integration; source-only first compile, NOT a bootable desktop package yet.
schema_version = 2
[board]
name = "nezha"
soc = "SM8850"
soc_source = "sm8850"
os_profile = "ios-27.0.1-24A446-iphone14-4"
kit = "nezha"
description = "Xiaomi 17 Ultra: isolated iPhone iOS27 integration, pinned-file policy required"
[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "QcomXnuUsbDebug", "ShengUfs", "RamBlock", "GopFramebuffer", "AppleKeyStoreState", "Adreno840", "SoftwareAES"]
[kernel]
defconfig = "nezha_ios27_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8850.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu-12377/series", "component:QcomXnuUsbDebug/patches/darwin25-xnu12377-unixnu/series"]
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform", "nezha-armcpu-asm-fix.py", "component:ArmCpu", "qualify-armcpu-instructions.py", "build-libpthread-kernel.py", "build-nezha27-als-owner.py", "component:QcomXnuUsbDebug", "build-nezha27-usb-control.py", "build-ios27-pmgr.py", "prepare-nezha27-baseband.py --tree .", "component:ShengUfs", "component:RamBlock", "component:AppleKeyStoreState", "build-gop-legacy-display-27.py", "build-nezha27-input.py", "build-nezha27-als.py", "build-nezha27-wifi.py", "build-nezha27-bluetooth.py", "component:SoftwareAES", "build-software-aes-iphone.py", "build-nezha27-baseband.py --tree .", "component:Adreno840"]
# G3 read-only root closure. Explicit IOStorageFamily retains its generic
# IOBlockStorageDriver/IOMediaBSDClient matching; dependency-only strips it.
[kernel.prelink]
roots = ["com.apple.security.AppleImage4", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.filesystems.apfs", "com.apple.iokit.IOStorageFamily", "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.security.sandbox", "com.apple.iokit.IOMobileGraphicsFamily", "com.apple.iokit.IOSurface", "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOGPUFamily"]
[device_tree]
source = "device:dts/nezha.dts"
include_dirs = ["soc:dts"]
preserve_memory_ranges = true
[payload]
volume = "NEZHA_IOS27"
size_mib = 176
loader = "firmware"
title = "nezha iPhone iOS27 development"
timeout = -1
panic_screen = true
# Only the local pack step stages the authenticated sidecar; CI carries no policies.
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
# GPU043: the exact 24A446 PNG callsite clears a fresh anonymous mmap a second
# time. Keep the original allocator/decoder and rely on mmap's zero-fill contract.
# The native signed-page fixup checks all 16 original bytes; only the BL changes.
# GPU046: AFDictationConnection must not requeue an availability notification
# when offlineDictationStatus is nil. The keyboard's notification handler queries
# this same function; a nil cache otherwise keeps that callback cycle alive.
# Non-nil state, language selection, ARC cleanup and block flags stay original.
# GPU047: retain GPU2, Wi-Fi02321 and Bluetooth02423 entries in the64-slot table.
