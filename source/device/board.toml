# iPhone iOS27 integration; source-only first compile, NOT a bootable desktop package yet.
schema_version = 2
[board]
name = "nezha"
soc = "SM8850"
soc_source = "sm8850"
os_profile = "ios-27.0.1-24A446-iphone14-4"
kit = "nezha"
description = "Xiaomi 17 Ultra: isolated iPhone iOS27 integration, pinned-file policy required"
[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "QcomXnuUsbDebug", "ShengUfs", "RamBlock", "GopFramebuffer", "AppleKeyStoreState", "Adreno840"]
[kernel]
defconfig = "nezha_ios27_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8850.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu-12377/series", "component:QcomXnuUsbDebug/patches/darwin25-xnu12377-unixnu/series"]
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform", "nezha-armcpu-asm-fix.py", "component:ArmCpu", "qualify-armcpu-instructions.py", "build-libpthread-kernel.py", "component:QcomXnuUsbDebug", "build-nezha27-usb-control.py", "build-ios27-pmgr.py", "component:ShengUfs", "component:RamBlock", "component:AppleKeyStoreState", "build-gop-legacy-display-27.py", "build-nezha27-input.py", "component:Adreno840"]
# G3 read-only root closure. Explicit IOStorageFamily retains its generic
# IOBlockStorageDriver/IOMediaBSDClient matching; dependency-only strips it.
[kernel.prelink]
roots = ["com.apple.security.AppleImage4", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.filesystems.apfs", "com.apple.iokit.IOStorageFamily", "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.security.sandbox", "com.apple.iokit.IOMobileGraphicsFamily", "com.apple.iokit.IOSurface", "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOUSBDeviceFamily", "com.apple.driver.AppleUSBXDCI", "com.apple.driver.AppleUSBDeviceMux"]
[device_tree]
source = "device:dts/nezha.dts"
include_dirs = ["soc:dts"]
preserve_memory_ranges = true
[payload]
volume = "NEZHA_IOS27"
size_mib = 176
loader = "firmware"
title = "nezha iPhone iOS27 development"
timeout = -1
panic_screen = true
# Only the local pack step stages the authenticated sidecar; CI carries no policies.
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
# Root input remains independent of 17; no Data/log persistence or remote reset.
#031 USB/early-kernel diagnostics are retained for the first read-only root test.
kernel_args = ["-v", "keepsyms=1", "debug=0x14e", "cpus=8", "boot-progress=2", "nezha-log=0", "native-source-storage=1", "native-source-storage-require-usb=1", "native-ufs-root=1", "sheng-data-persist=2", "ram-data-volatile-4g=0", "sheng-data-reset=0", "sheng-log=0", "nezha-reboot-after=0", "nezha-panic-reset=0", "qcom-usb-debug=1", "qcom-usb-ctl=1", "nezha-usb-reboot=1", "use_contiguous_hint=0", "sheng-pmgr=2", "sheng-disable-watchdogd=1", "sheng-exc-name=SpringBoard,backboardd,Preferences", "offline-mobile-graphics-load=1", "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-unit-scale=3", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "offline-legacy-phase=4", "offline-key-events=1", "sheng-aks=1", "sheng-fb-gpu=1", "sheng-dpu-scanout=0", "offline-hid-input=1", "offline-hid-home=1", "sheng-touch-hid=1", "nezha-input=1", "nezha-touch=15", "boot-ui-follow=1", "offline-hid-auto-home=90", "boot-diag-console=2", "nezha-backlight=1", "input-test=0", "nezha-gpu-metal=1", "sheng-gpu-trace=1", "sheng-gpu-addon=1", "boot-diag-overlay=0", "boot-ui-focus3=Preferences"]

# Format2 exports chosen metadata from the typed ADT table.
[adt.chosen.u32]
"kernel-ctrr-to-be-enabled" = 0

# First root mount: use the real independently verified iPhone OS identity.
[root]
os_volume_uuid = "28E4CF35-9C12-417E-B8FF-906618C6FD22"
systemos_volume_uuid = "FFADDA0D-7102-4121-8AB8-48818B912D06"
os_image_sha256 = "d7037ea730b12d11f72e751884c23b1f3c67bb12ccb828c750f9df5765ad093c"
systemos_image_sha256 = "00fac48583c9d347aa9403c9cecf8d511650fba28f670aa70265e4c61f46aad8"
[payload.adt]
chip_id = "8110"
unique_chip_id = "required"
packed_data_ramdisk = true
root_match_volume_uuid = "28E4CF35-9C12-417E-B8FF-906618C6FD22"

# Same selected-XNU sizing contract as current sheng27, for owned4864MiB.
# Native xsmall CONFIG_VNODES=1024 would otherwise trigger vnode-pressure jetsam.
[adt.defaults.u32]
"kern.maxvnodes" = 78848

# No mechanical Home button on nezha/iPhone14,4;selected official typed ADT.
[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"
[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]
[adt.buttons.u32]
home-button-type = 2
