name: nezha iPhone27 display discovery and UI coverage 038b
on:
  push:
    branches: [codex/ios27-gpu27-metal-full-038b-20261112]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nezha-gpu27-metal-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS: "0"
  UNIXNU_COMMIT: a3faa4a43cadcd288fbe9cee3794d5a120629742
  ADRENO740_COMMIT: 1030485546ef7ebb9abbfb7c17fbca93cca40971
  ABI_SHA256: d1c8a27d6e61787073c2c56a779ff4d5c43d86f2d23ac0c0fba0368af8dcdeae
  PROFILE_CHIP_ID: "0x44050a31"
  PROFILE_GMEM_BYTES: "0x1200000"
  PROFILE_GMEM_BASE: "0x4000000"
  RUST_TOOLCHAIN: 1.98.0
  CARGO_BUILD_JOBS: 3
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 345
    steps:
      - name: Check out the dedicated source inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: device
          persist-credentials: false
      - name: Check out the pinned upstream framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: a3faa4a43cadcd288fbe9cee3794d5a120629742
          path: unixnu
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Verify complete CI source identity before installing tools
        run: |
          python3 device/ci/gpu-userland/prepare.py --check-sources-only
          python3 device/ci/gpu-userland/test-source-manifest.py
      - name: Install and identify the host tools
        run: |
          set -euo pipefail
          echo "LOGS=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/logs"
          brew install glslang shaderc spirv-tools molten-vk vulkan-headers llvm ninja openssl@3 > "$RUNNER_TEMP/logs/brew.log" 2>&1
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix llvm)/bin:$HOME/.cargo/bin:$PATH"
          if ! command -v rustup > /dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none > "$RUNNER_TEMP/logs/rustup-install.log" 2>&1
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rust-src --target aarch64-apple-ios > "$RUNNER_TEMP/logs/rustup.log" 2>&1
          { sw_vers; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; rustc "+$RUST_TOOLCHAIN" -vV;
            llvm-as --version; glslangValidator --version; glslc --version; spirv-val --version; } > "$RUNNER_TEMP/logs/tools.log" 2>&1
          echo "NMB_HOST_LOADER=$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" >> "$GITHUB_ENV"
      - name: Prepare the exact public source and patch inputs
        run: device/ci/gpu-userland/logrun prepare python3 device/ci/gpu-userland/prepare.py --unixnu unixnu --record "$LOGS/sources.json"
      - name: Check actual-source real Mesa trees,device lifetimes and swap API guards
        id: device_contexts
        run: device/ci/gpu-userland/logrun device-contexts python3 device/ci/gpu-userland/check-device-context-host.py --unixnu unixnu --logs "$LOGS"
      - name: Qualify host syntax and actual iOS ARM signal handlers
        id: frontend_targets
        run: device/ci/gpu-userland/logrun frontend-targets python3 device/ci/gpu-userland/check-intel-frontend.py --unixnu unixnu --report "$LOGS/frontend-target-equality.json"
      - name: Check the actual shader primer wait policy
        id: primer_policy
        run: device/ci/gpu-userland/logrun primer-policy python3 device/ci/gpu-userland/check-primer-wait-host.py --unixnu unixnu --logs "$LOGS"
      - name: Verify actual driver phase clocks and frontend record packing
        id: driver_profile
        run: device/ci/gpu-userland/logrun driver-profile python3 device/ci/gpu-userland/check-driver-profile-host.py --unixnu unixnu --logs "$LOGS"
      - name: Check actual tile-store allocation failure and command completion
        id: tile_store_errors
        run: device/ci/gpu-userland/logrun tile-store-errors python3 device/ci/gpu-userland/check-tile-store-error-host.py --unixnu unixnu --logs "$LOGS"
      - name: Check actual synchronous frontend spans and CPU records
        id: sync_profile
        run: device/ci/gpu-userland/logrun sync-profile python3 device/ci/gpu-userland/check-metal-sync-profile.py --source unixnu/drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm --out "$LOGS/sync-profile" --decoder device/ci/gpu-userland/decode-sync-frames.py
      - name: Check actual display reader, frame producer and complete decoder
        id: display_profile
        run: device/ci/gpu-userland/logrun display-profile python3 device/ci/gpu-userland/check-display-timing.py --source unixnu/drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm --gop unixnu/drivers/GopFramebuffer --core device/ci/gpu-userland/fixtures/display --reader-test device/ci/gpu-userland/fixtures/display/check-dpu-timing.c --decoder device/ci/gpu-userland/decode-display-timing.py --out "$LOGS/display-profile"
      - name: Observe actual Mac waiting threads and bounded stacks
        id: render_wait
        run: device/ci/gpu-userland/logrun render-wait python3 device/ci/gpu-userland/check-render-wait.py --source unixnu/drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm --header unixnu/drivers/AdrenoMetal/NativeRenderWaitSample.h --decoder device/ci/gpu-userland/decode-render-wait.py --out "$LOGS/render-wait"
      - name: Check exact read-only display observer and CPU brackets
        id: frame_observers
        run: device/ci/gpu-userland/logrun frame-observers python3 device/ci/gpu-userland/check-frame-observers.py --source unixnu/drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm --out "$LOGS/frame-observers"
      - name: Observe the actual Mac main thread using the client sampler
        id: ui_main
        run: device/ci/gpu-userland/logrun ui-main python3 device/ci/gpu-userland/check-client-wait.py --source unixnu/drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm --decoder device/ci/gpu-userland/decode-render-wait.py --out "$LOGS/ui-main"
      - name: Exercise delayed display discovery with actual Objective-C and Mach reads
        id: display_discovery
        run: device/ci/gpu-userland/logrun display-discovery python3 device/ci/gpu-userland/check-display-discovery.py --source unixnu/drivers/AdrenoMetal/NativeBridgeMetalFrontend.mm --out "$LOGS/display-discovery"
      - name: Build Turnip for the actual A840 arm64e iOS27 target
        id: turnip_ios27
        working-directory: unixnu
        run: ../device/ci/gpu-userland/logrun turnip-ios27 python3 scripts/build-turnip-darwin.py --target ios27
      - name: Build the iPhone-safe full-chain Metal plugin
        id: plugin
        working-directory: unixnu
        run: ../device/ci/gpu-userland/logrun plugin python3 scripts/build-adreno-metal-plugin.py --target ios27 --iphone-24a446 --no-replay
      - name: Bind unchanged runtime to prior host-test sources
        id: runtime_source
        run: device/ci/gpu-userland/logrun runtime-source python3 device/ci/gpu-userland/check-unchanged-runtime.py --unixnu unixnu --logs "$LOGS"
      - name: Test the actual patched allocator and bind its complete source
        id: buffer_reserve
        if: ${{ false }} # Exact unchanged runtime: reuse prior Mac tests, recorded separately.
        run: device/ci/gpu-userland/logrun buffer-reserve python3 device/ci/gpu-userland/check-buffer-reserve.py --unixnu unixnu --logs "$LOGS"
      - name: Check actual Vulkan recorder arguments and diagnostic links
        id: vulkan_operations
        if: ${{ false }} # Exact unchanged runtime: reuse prior Mac tests, recorded separately.
        run: device/ci/gpu-userland/logrun vulkan-operations python3 device/ci/gpu-userland/check-vulkan-operations.py --unixnu unixnu --logs "$LOGS"
      - name: Check exact tiled bytes, edge padding and dispatch limits
        id: tiled_words
        if: ${{ false }} # Exact unchanged runtime: reuse prior Mac tests, recorded separately.
        run: device/ci/gpu-userland/logrun tiled-words python3 device/ci/gpu-userland/check-tiled-words.py --unixnu unixnu --logs "$LOGS"
      - name: Check the retained edge preservation planner and byte oracle
        id: heap_copies
        if: ${{ false }} # Exact unchanged runtime: reuse prior Mac tests, recorded separately.
        run: device/ci/gpu-userland/logrun heap-copies python3 device/ci/gpu-userland/check-heap-copies.py --unixnu unixnu --logs "$LOGS"
      - name: Verify the actual signed target and full-chain code selection
        id: full_target
        run: device/ci/gpu-userland/logrun full-target python3 device/ci/gpu-userland/check-full-target.py --unixnu unixnu --logs "$LOGS"
      - name: Verify and seal independent outputs and all diagnostics
        if: always()
        env:
          OUTCOME_FRONTEND_TARGETS: ${{ steps.frontend_targets.outcome }}
          OUTCOME_TURNIP_IOS27: ${{ steps.turnip_ios27.outcome }}
          OUTCOME_PLUGIN: ${{ steps.plugin.outcome }}
          OUTCOME_FULL_TARGET: ${{ steps.full_target.outcome }}
          OUTCOME_HEAP_COPIES: ${{ steps.heap_copies.outcome }}
          OUTCOME_TILED_WORDS: ${{ steps.tiled_words.outcome }}
          OUTCOME_VULKAN_OPERATIONS: ${{ steps.vulkan_operations.outcome }}
          OUTCOME_BUFFER_RESERVE: ${{ steps.buffer_reserve.outcome }}
          OUTCOME_DEVICE_CONTEXTS: ${{ steps.device_contexts.outcome }}
          OUTCOME_PRIMER_POLICY: ${{ steps.primer_policy.outcome }}
          OUTCOME_RUNTIME_SOURCE: ${{ steps.runtime_source.outcome }}
          OUTCOME_DRIVER_PROFILE: ${{ steps.driver_profile.outcome }}
          OUTCOME_TILE_STORE_ERRORS: ${{ steps.tile_store_errors.outcome }}
          OUTCOME_SYNC_PROFILE: ${{ steps.sync_profile.outcome }}
          OUTCOME_DISPLAY_PROFILE: ${{ steps.display_profile.outcome }}
          OUTCOME_RENDER_WAIT: ${{ steps.render_wait.outcome }}
          OUTCOME_FRAME_OBSERVERS: ${{ steps.frame_observers.outcome }}
          OUTCOME_UI_MAIN: ${{ steps.ui_main.outcome }}
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 device/ci/gpu-userland/collect.py --unixnu unixnu --device device --logs "$RUNNER_TEMP/logs" --out "$RUNNER_TEMP/out" --sealed "$RUNNER_TEMP/sealed" --debug-out "$RUNNER_TEMP/debug-out" --debug-sealed "$RUNNER_TEMP/debug-sealed" > "$RUNNER_TEMP/collect.log" 2>&1
      - name: Upload only the CMS encrypted artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nezha-gpu27-metal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sealed/bundle.cms
            ${{ runner.temp }}/sealed/envelope.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain the encrypted debug symbols separately for on-demand analysis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nezha-gpu27-metal-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/debug-sealed/bundle.cms
            ${{ runner.temp }}/debug-sealed/envelope.json
          if-no-files-found: warn
          retention-days: 90
      - name: Report the actual qualification outcome after evidence upload
        if: always()
        env:
          TARGETS: ${{ steps.frontend_targets.outcome }}
          TURNIP: ${{ steps.turnip_ios27.outcome }}
          PLUGIN: ${{ steps.plugin.outcome }}
          FULL_TARGET: ${{ steps.full_target.outcome }}
          HEAP_COPIES: ${{ steps.heap_copies.outcome }}
          TILED_WORDS: ${{ steps.tiled_words.outcome }}
          VULKAN_OPERATIONS: ${{ steps.vulkan_operations.outcome }}
          BUFFER_RESERVE: ${{ steps.buffer_reserve.outcome }}
          DEVICE_CONTEXTS: ${{ steps.device_contexts.outcome }}
          RUNTIME_SOURCE: ${{ steps.runtime_source.outcome }}
          SYNC_PROFILE: ${{ steps.sync_profile.outcome }}
          DISPLAY_PROFILE: ${{ steps.display_profile.outcome }}
          RENDER_WAIT: ${{ steps.render_wait.outcome }}
          FRAME_OBSERVERS: ${{ steps.frame_observers.outcome }}
          UI_MAIN: ${{ steps.ui_main.outcome }}
        run: |
          set -euo pipefail
          test "$TARGETS" = success
          test "$TURNIP" = success
          test "$PLUGIN" = success
          test "$FULL_TARGET" = success
          test "$DEVICE_CONTEXTS" = success
          test "$RUNTIME_SOURCE" = success
          test "$SYNC_PROFILE" = success
          test "$DISPLAY_PROFILE" = success
          test "$RENDER_WAIT" = success
          test "$FRAME_OBSERVERS" = success
          test "$UI_MAIN" = success
          test "$BUFFER_RESERVE" = skipped
          test "$VULKAN_OPERATIONS" = skipped
          test "$TILED_WORDS" = skipped
          test "$HEAP_COPIES" = skipped
