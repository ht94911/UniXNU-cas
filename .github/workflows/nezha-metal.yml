name: nezha GPU Metal runtime capability 009 on ARM macOS
on:
  push:
    branches: [codex/ios27-gpu27-metal-capability-009-20261103]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nezha-gpu27-metal-capability-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS: "0"
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
jobs:
  capability:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Verify the exact committed source inputs
        run: python3 ci/gpu-userland/prepare.py --check-sources-only
      - name: Prepare only the host capability tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          echo "LOGS=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
          brew install molten-vk vulkan-headers openssl@3 > "$RUNNER_TEMP/logs/brew.log" 2>&1
          echo "NMB_HOST_LOADER=$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" >> "$GITHUB_ENV"
          { uname -m; sw_vers; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; } > "$RUNNER_TEMP/logs/tools.log"
      - name: Exercise the runtime-required argument-buffer configuration
        id: capability
        continue-on-error: true
        run: ci/gpu-userland/logrun runtime-contract python3 ci/gpu-userland/check-host-driver.py --logs "$LOGS"
      - name: Seal capability evidence, never a frontend or phone qualification
        if: always()
        env:
          CAPABILITY_OUTCOME: ${{ steps.capability.outcome }}
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 - <<'PY'
          import importlib.util,json,os,pathlib
          spec=importlib.util.spec_from_file_location('sealed', 'ci/xnu/artifacts.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          logs=pathlib.Path(os.environ['RUNNER_TEMP'])/'logs';logs.mkdir(exist_ok=True)
          state={'scope':'ARM macOS Vulkan argument-buffer capability only','outcome':os.environ.get('CAPABILITY_OUTCOME'),'frontend_pixel_tested':False,'phone_operations':False}
          (logs/'capability-state.json').write_text(json.dumps(state,indent=2)+'\n')
          names=[p.relative_to(logs).as_posix() for p in sorted(logs.rglob('*')) if p.is_file() and not p.is_symlink()]
          module.seal(logs,names,pathlib.Path('ci/xnu/artifact-recipient.pem'),pathlib.Path(os.environ['RUNNER_TEMP'])/'sealed')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nezha-gpu27-metal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sealed/bundle.cms
            ${{ runner.temp }}/sealed/envelope.json
          if-no-files-found: error
          retention-days: 90
