name: Device documentation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  porting-record:
    name: Porting record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: device
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ht94911/UniXNU
          ref: 13ef9f7bfb16af56d10f70fc284e5276daa62e38
          path: tools
          persist-credentials: false
      - name: Validate structure and affected areas
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="refs/remotes/origin/$DEFAULT_BRANCH"
          fi
          python3 tools/scripts/porting-record.py check --device device --base "$BASE"
