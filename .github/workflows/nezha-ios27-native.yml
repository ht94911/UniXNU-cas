name: nezha AA27 ordinary SecItem app006
on:
  push:
    branches: [codex/ios27-account-app006-20261111]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nezha-account-probe-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - name: Check out only the dedicated helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the existing CMS tool
        run: brew install openssl@3 > "$RUNNER_TEMP/account-probe-setup.log" 2>&1
      - name: Compile and qualify the ordinary iOS helper
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 ci/account-app.py --output "$RUNNER_TEMP/account-probe" --sealed "$RUNNER_TEMP/account-probe-sealed"
      - name: Retain only the existing encrypted envelope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nezha-ios27-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/account-probe-sealed/bundle.cms
            ${{ runner.temp }}/account-probe-sealed/envelope.json
          if-no-files-found: error
          retention-days: 90
