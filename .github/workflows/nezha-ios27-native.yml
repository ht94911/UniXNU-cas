name: nezha iPhone27 audio - HAL062
on:
  push:
    branches: [codex/ios27-audio-gpu023-hal062-20261112]
permissions:
  contents: read
concurrency:
  group: nezha-audio-hal-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: task
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Build the HAL and execute its SDK host contract
        run: python3 task/ci/hal.py build --root "$RUNNER_TEMP/audio062/work"
      - name: Seal using the existing owner envelope
        if: always()
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 task/ci/hal.py seal --root "$RUNNER_TEMP/audio062/work" --out "$RUNNER_TEMP/audio062/sealed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nezha-ios27-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/audio062/sealed/bundle.cms
            ${{ runner.temp }}/audio062/sealed/envelope.json
          if-no-files-found: error
          retention-days: 90
