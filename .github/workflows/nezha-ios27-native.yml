name: nezha iPhone27 AppSync host suite - tests002
on:
  push:
    branches: [codex/ios27-appsync-tests-002-20261109]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nezha-ios27-native-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 345
    steps:
      - name: Check out the dedicated build inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: task
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Run production hooks and signing regressions
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ios27/work"
          mkdir -p "$work/logs" "$RUNNER_TEMP/ios27/setup-logs"
          brew install openssl@3 > "$RUNNER_TEMP/ios27/setup-logs/brew.log" 2>&1
          python3 task/source/appsync/test.py --device task/source/device --signing 2>&1 | tee "$work/logs/appsync-tests.log"
      - name: Seal outputs and diagnostics using the existing owner envelope
        if: always()
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 task/ci/native.py collect --framework task --work "$RUNNER_TEMP/ios27/work" --sealed "$RUNNER_TEMP/ios27/sealed"
      - name: Upload only the encrypted artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nezha-ios27-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios27/sealed/bundle.cms
            ${{ runner.temp }}/ios27/sealed/envelope.json
          if-no-files-found: error
          retention-days: 90
