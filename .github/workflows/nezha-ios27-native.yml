name: nezha iPhone27 Camera101 native NV12 IOSurface capability
on:
  push:
    branches: [codex/ios27-camera101-nv12-iosurface-20261119]
permissions:
  contents: read
concurrency:
  group: nezha-gnss-userland-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - name: Check out only the necessary NV12 sampler source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the existing encryption tool
        run: brew install openssl@3 > "$RUNNER_TEMP/gnss-userland-setup.log" 2>&1
      - name: Build and sign the NV12 sampler
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 ci/corelocation.py --out "$RUNNER_TEMP/gnss-userland" --sealed "$RUNNER_TEMP/gnss-userland-sealed"
      - name: Retain only the encrypted NV12 sampler envelope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nezha-ios27-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gnss-userland-sealed/bundle.cms
            ${{ runner.temp }}/gnss-userland-sealed/envelope.json
          if-no-files-found: error
          retention-days: 90
