name: nezha ordinary UIKit haptics app on GPU051
on:
  push:
    branches: [codex/ios27-haptics-ui001-gpu051-20261117]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nezha-ios27-native-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Check out the dedicated build inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: task
          persist-credentials: false
      - name: Build and sign ordinary UIKit haptics app and original LS helper
        run: python3 task/source/device/scripts/build-nezha27-haptics-userland.py --source task/source/device/package/haptics27/userland --out "$RUNNER_TEMP/haptics-ui"
      - name: Seal haptics app and its complete build records
        if: always()
        run: |
          python3 - <<'PYBUILD'
          import os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'haptics-ui'
          command=['python3','task/ci/artifacts.py','seal','--root',str(root),'--recipient','task/ci/artifact-recipient.pem','--out',str(root.with_name('haptics-ui-sealed'))]
          for p in sorted(root.rglob('*')):
              if p.is_file():command.extend(['--file',p.relative_to(root).as_posix()])
          subprocess.run(command,check=True)
          PYBUILD
      - name: Upload only the encrypted artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nezha-ios27-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/haptics-ui-sealed/bundle.cms
            ${{ runner.temp }}/haptics-ui-sealed/envelope.json
          if-no-files-found: error
          retention-days: 90
