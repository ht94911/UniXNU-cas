name: nezha finite CoreHaptics probe on GPU051
on:
  push:
    branches: [codex/ios27-haptics-core001-gpu051-20261116]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nezha-ios27-native-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Check out the dedicated build inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: task
          persist-credentials: false
      - name: Build the finite normal CoreHaptics probe
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/haptics-probe"
          xcrun clang -target arm64e-apple-ios27.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -fobjc-arc -O2 -g0 -Wall -Wextra -Werror -framework Foundation -framework CoreHaptics -framework AudioToolbox task/source/device/package/haptics27/hal/NezhaHapticsSystemProbe.m -o "$RUNNER_TEMP/haptics-probe/NezhaHapticCoreTest" > "$RUNNER_TEMP/haptics-probe/build.log" 2>&1
          codesign --force --sign - --pagesize 4096 --identifier org.unixnu.nezha.haptic-core-test "$RUNNER_TEMP/haptics-probe/NezhaHapticCoreTest"
          codesign --verify --strict "$RUNNER_TEMP/haptics-probe/NezhaHapticCoreTest"
          codesign --display --verbose=4 "$RUNNER_TEMP/haptics-probe/NezhaHapticCoreTest" > "$RUNNER_TEMP/haptics-probe/signature.txt" 2>&1
      - name: Seal finite probe and build records
        if: always()
        run: |
          set -euo pipefail
          python3 task/ci/artifacts.py seal --root "$RUNNER_TEMP/haptics-probe" --file NezhaHapticCoreTest --file build.log --file signature.txt --recipient task/ci/artifact-recipient.pem --out "$RUNNER_TEMP/haptics-probe-sealed"
      - name: Upload only the encrypted artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nezha-ios27-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/haptics-probe-sealed/bundle.cms
            ${{ runner.temp }}/haptics-probe-sealed/envelope.json
          if-no-files-found: error
          retention-days: 90
