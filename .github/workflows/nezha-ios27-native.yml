name: nezha iPhone27 B package on GPU024 - native016
on:
  push:
    branches: [codex/ios27-bb-gpu024-native016-20261114]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nezha-ios27-native-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 345
    steps:
      - name: Check out the dedicated build inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: task
          persist-credentials: false
      - name: Check out the pinned upstream framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 88604d01c191727bf4b4113269b3a9518bb730d3
          path: unixnu
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install host build tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios27/setup-logs"
          brew install cmake ninja unifdef llvm openssl@3 > "$RUNNER_TEMP/ios27/setup-logs/brew.log" 2>&1
          test -x "$(brew --prefix llvm)/bin/llvm-objdump"
          printf 'UNIXNU_LLVM_OBJDUMP=%s/bin/llvm-objdump\n' "$(brew --prefix llvm)" >> "$GITHUB_ENV"
      - name: Reconstruct and verify the exact integration source tree
        run: python3 task/ci/native.py prepare --framework unixnu --work "$RUNNER_TEMP/ios27/work"
      - name: Exercise actual iPhone27 reboot and plane mapping methods
        run: |
          python3 "$RUNNER_TEMP/ios27/work/device/scripts/check-persistent-data.py" --ufs "$RUNNER_TEMP/ios27/work/ufs" --device "$RUNNER_TEMP/ios27/work/device" --usb "$RUNNER_TEMP/ios27/work/usb" --output "$RUNNER_TEMP/ios27/persist-contracts"
          python3 "$RUNNER_TEMP/ios27/work/device/scripts/check-persistent-marker.py" --device "$RUNNER_TEMP/ios27/work/device" --output "$RUNNER_TEMP/ios27/persist-marker"
          python3 "$RUNNER_TEMP/ios27/work/device/scripts/check-touch-edge.py" --output "$RUNNER_TEMP/ios27/touch-edge"
          python3 "$RUNNER_TEMP/ios27/work/gop/Test/check-plane-view.py" --output "$RUNNER_TEMP/ios27/gop-view-check"
      - name: Check the actual guarded waiting-stack sampler
        run: python3 task/source/device/scripts/check-stable-kernel-stack.py
      - name: Verify QMUX service and endpoint contracts on the host
        run: |
          set -euo pipefail
          bb="$RUNNER_TEMP/ios27/work/device"
          for test in qmux_version qmux_endpoint qmux_capacity low_memory sim_identity pdp_flow voice_state; do
            clang -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined -I "$bb/package/baseband27/bridge" -I "$bb/package/baseband27/bridge/upstream" "$bb/tests/baseband27/${test}_test.c" -o "$RUNNER_TEMP/ios27/$test"
            "$RUNNER_TEMP/ios27/$test"
          done
          clang -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined "$bb/tests/baseband27/mss_reuse_test.c" "$bb/package/baseband27/platform/NbMss.c" "$bb/package/baseband27/platform/NbPas.c" "$bb/package/baseband27/upstream/QcomMdt.c" "$bb/package/baseband27/upstream/QcomGlink.c" "$bb/package/baseband27/upstream/QcomSmem.c" "$bb/package/baseband27/upstream/QcomSmp2p.c" -o "$RUNNER_TEMP/ios27/mss_reuse"
          "$RUNNER_TEMP/ios27/mss_reuse"
          clang -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined "$bb/tests/baseband27/ipa_smem_test.c" "$bb/package/baseband27/upstream/QcomSmem.c" -o "$RUNNER_TEMP/ios27/ipa_smem"
          "$RUNNER_TEMP/ios27/ipa_smem"
          clang -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined "$bb/tests/baseband27/startup_order_test.c" "$bb/package/baseband27/platform/NbBaseband.c" "$bb/package/baseband27/platform/NbMss.c" "$bb/package/baseband27/platform/NbPas.c" "$bb/package/baseband27/upstream/QcomMdt.c" "$bb/package/baseband27/upstream/QcomGlink.c" "$bb/package/baseband27/upstream/QcomSmem.c" "$bb/package/baseband27/upstream/QcomSmp2p.c" "$bb/package/baseband27/transport/NbQrtr.c" "$bb/package/baseband27/services/NbRmtfs.c" "$bb/package/baseband27/services/NbTftp.c" "$bb/package/baseband27/services/NbMemshare.c" "$bb/package/baseband27/services/NbServloc.c" -o "$RUNNER_TEMP/ios27/startup_order"
          "$RUNNER_TEMP/ios27/startup_order"
          clang -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined "$bb/tests/baseband27/boot_ready_test.c" "$bb/package/baseband27/transport/NbQrtr.c" -o "$RUNNER_TEMP/ios27/boot_ready"
          "$RUNNER_TEMP/ios27/boot_ready"
          CC=clang python3 "$bb/tests/baseband27/ipa_sram_test.py"
      - name: Qualify compiler and run the standard native build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 task/ci/native.py build --framework unixnu --work "$RUNNER_TEMP/ios27/work"
      - name: Seal outputs and diagnostics using the existing owner envelope
        if: always()
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 task/ci/native.py collect --framework unixnu --work "$RUNNER_TEMP/ios27/work" --sealed "$RUNNER_TEMP/ios27/sealed"
      - name: Upload only the encrypted artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nezha-ios27-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios27/sealed/bundle.cms
            ${{ runner.temp }}/ios27/sealed/envelope.json
          if-no-files-found: error
          retention-days: 90
