name: Format2 source preflight
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse board and source contracts
        run: |
          python3 - <<'PY'
          import ast, json, pathlib, tomllib
          root = pathlib.Path('.')
          for name in ['board.toml','porting.toml','feeds.toml','unixnu.lock']:
              tomllib.loads((root/name).read_text())
          json.loads((root/'ci/xnu/format2-sources.json').read_text())
          for name in ['ci/xnu/build_format2.py','scripts/cas_upstream_firmware.py','scripts/audit_cas_format2.py']:
              ast.parse((root/name).read_text())
          PY
