name: XNU source kernel
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cas-format2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install current upstream build tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in cmake ninja unifdef llvm lld; do
            if ! brew list --versions "$tool" >/dev/null 2>&1; then brew install "$tool"; fi
          done
      - name: Build standard layered continuous kernel and own user process
        run: python3 -B ci/xnu/build_format2.py --out "$RUNNER_TEMP/cas-format2-001" -j4
      - name: Retain encrypted owner results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cas-format2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cas-format2-001/sealed/bundle.cms
            ${{ runner.temp }}/cas-format2-001/sealed/envelope.json
          if-no-files-found: error
          retention-days: 7
